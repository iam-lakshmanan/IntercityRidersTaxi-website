name: Build and Deploy

on:
  push:
    branches:
      - main

concurrency:
  group: production-deployment
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ vars.DOCKERHUB_USERNAME }}/intercity-oneway-taxi:latest
          build-args: |
            NEXT_PUBLIC_GOOGLE_MAPS_API_KEY=${{ secrets.NEXT_PUBLIC_GOOGLE_MAPS_API_KEY }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.SERVER_SSH_KEY }}" | tr -d '\r' > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${{ secrets.SERVER_HOST }}" >> ~/.ssh/known_hosts

      - name: Deploy on server
        run: |
          ssh -i ~/.ssh/id_ed25519 \
            "${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}" \
            'bash -s' <<'EOF'
          set -e

          IMAGE="${{ vars.DOCKERHUB_USERNAME }}/intercity-oneway-taxi:latest"
          ENV_FILE="/opt/apps/intercityonewaytaxi.in/.env"

          if [ ! -f "$ENV_FILE" ]; then
            echo "Missing environment file: $ENV_FILE"
            exit 1
          fi

          docker pull "$IMAGE"
          docker rm -f intercity-oneway-taxi 2>/dev/null || true

          docker run -d \
            --name intercity-oneway-taxi \
            --restart unless-stopped \
            -p 3006:3000 \
            --env-file "$ENV_FILE" \
            "$IMAGE"

          docker image prune -f
          docker ps --filter "name=intercity-oneway-taxi"
          EOF
